[project]
name = "nexusai"
version = "2.0.0"
description = "NexusAI — Smart Factory Real-Time Operations Platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["services"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require services running)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
