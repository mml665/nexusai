services:
  # ==================== 基础设施层 ====================
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: nexusai-postgres
    environment:
      POSTGRES_DB: nexusai
      POSTGRES_USER: nexusai
      POSTGRES_PASSWORD: nexusai123
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusai"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexusai-net

  redis:
    image: redis:7-alpine
    container_name: nexusai-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nexusai-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: nexusai-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nexusai-net

  # ==================== 可观测性基础设施 ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: nexusai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.page-title=NexusAI 指标监控 - Prometheus"
    networks:
      - nexusai-net

  grafana:
    image: grafana/grafana:latest
    container_name: nexusai-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      # 中文化设置
      - GF_USERS_DEFAULT_LANGUAGE=zh-CN
      - GF_DATE_FORMATS_DEFAULT_TIMEZONE=Asia/Shanghai
      - GF_DATE_FORMATS_FULL_DATE=YYYY年MM月DD日 HH:mm:ss
      - GF_DATE_FORMATS_INTERVAL_DAY=YYYY年MM月DD日
      - GF_AUTH_LOGIN_LOCALE=zh-CN
      - GF_BROWSERS_LOCALE=zh-CN
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      # 默认仪表盘
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/nexusai-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - nexusai-net

  # ==================== 工厂模拟器 ====================
  simulator:
    build: ./simulator
    container_name: nexusai-simulator
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - GATEWAY_URL=http://gateway:8000
      - PUSH_INTERVAL=1.0
    ports:
      - "8009:8009"
    networks:
      - nexusai-net

  # ==================== 微服务层 ====================
  gateway:
    build:
      context: ./services
      dockerfile: gateway/Dockerfile
    container_name: nexusai-gateway
    depends_on:
      iot_collector:
        condition: service_healthy
      analytics:
        condition: service_healthy
      alert:
        condition: service_healthy
      asset_manager:
        condition: service_healthy
      ai_engine:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://nexusai:nexusai123@postgres:5432/nexusai
      - JWT_SECRET=${JWT_SECRET:-nexusai-dev-secret-change-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:80,http://localhost:5173}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nexusai-net

  iot_collector:
    build:
      context: ./services
      dockerfile: iot_collector/Dockerfile
    container_name: nexusai-iot
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://nexusai:nexusai123@postgres:5432/nexusai
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:80,http://localhost:5173}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nexusai-net

  stream_processor:
    build:
      context: ./services
      dockerfile: stream_processor/Dockerfile
    container_name: nexusai-stream
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://nexusai:nexusai123@postgres:5432/nexusai
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:80,http://localhost:5173}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - nexusai-net

  ai_engine:
    build:
      context: ./services
      dockerfile: ai_engine/Dockerfile
    container_name: nexusai-ai
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "8004:8004"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://nexusai:nexusai123@postgres:5432/nexusai
      - ES_URL=http://elasticsearch:9200
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - JWT_SECRET=${JWT_SECRET:-nexusai-dev-secret-change-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:80,http://localhost:5173}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - nexusai-net

  analytics:
    build:
      context: ./services
      dockerfile: analytics/Dockerfile
    container_name: nexusai-analytics
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8005:8005"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://nexusai:nexusai123@postgres:5432/nexusai
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:80,http://localhost:5173}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nexusai-net

  alert:
    build:
      context: ./services
      dockerfile: alert/Dockerfile
    container_name: nexusai-alert
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8006:8006"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://nexusai:nexusai123@postgres:5432/nexusai
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:80,http://localhost:5173}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8006/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nexusai-net

  asset_manager:
    build:
      context: ./services
      dockerfile: asset_manager/Dockerfile
    container_name: nexusai-asset
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8007:8007"
    environment:
      - DATABASE_URL=postgresql://nexusai:nexusai123@postgres:5432/nexusai
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-nexusai-dev-secret-change-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:80,http://localhost:5173}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8007/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nexusai-net

  observability:
    build:
      context: ./services
      dockerfile: observability/Dockerfile
    container_name: nexusai-obs
    depends_on:
      gateway:
        condition: service_healthy
      iot_collector:
        condition: service_healthy
      ai_engine:
        condition: service_healthy
      analytics:
        condition: service_healthy
      alert:
        condition: service_healthy
      asset_manager:
        condition: service_healthy
    ports:
      - "8008:8008"
    environment:
      - SERVICES=gateway:8000,iot_collector:8001,stream_processor:8002,ai_engine:8004,analytics:8005,alert:8006,asset_manager:8007
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://nexusai:nexusai123@postgres:5432/nexusai
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:80,http://localhost:5173}
    networks:
      - nexusai-net

  # ==================== 前端 ====================
  frontend:
    build: ./frontend
    container_name: nexusai-frontend
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - nexusai-net

  # ==================== 反向代理 ====================
  nginx:
    image: nginx:alpine
    container_name: nexusai-nginx
    depends_on:
      - gateway
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - nexusai-net

volumes:
  pg_data:
  redis_data:
  es_data:
  prometheus_data:
  grafana_data:

networks:
  nexusai-net:
    driver: bridge
